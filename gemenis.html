<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar Fluid State Toggle</title>
    <style>
      :root {
        --bg-color: #f4f6f8;
        --sidebar-bg: #1e293b;
        --text-color: #f8fafc;
        --hover-bg: #334155;
        --accent-color: #3b82f6;
        --sidebar-width: 250px;
        --transition-speed: 0.35s;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        min-height: 100vh;
        display: flex;
      }

      /* BARRA DE NAVEGACIÓN LATERAL */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: var(--sidebar-width);
        background-color: var(--sidebar-bg);
        color: var(--text-color);
        transition: width var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 100;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      }

      .sidebar-header {
        padding: 20px 15px;
        display: flex;
        align-items: center;
        height: 60px;
        border-bottom: 1px solid var(--hover-bg);
        white-space: nowrap;
      }

      .sidebar-menu {
        list-style: none;
        padding: 10px 0;
      }

      .menu-item {
        position: relative;
      }

      .menu-link {
        display: flex;
        align-items: center;
        padding: 14px 23px;
        color: var(--text-color);
        text-decoration: none;
        white-space: nowrap;
        transition: background-color 0.2s ease;
      }

      .menu-link:hover {
        background-color: var(--hover-bg);
      }

      .menu-icon {
        font-size: 1.2rem;
        min-width: 24px;
        display: flex;
        justify-content: center;
      }

      .menu-text {
        margin-left: 15px;
        opacity: 1;
        transition: opacity var(--transition-speed) ease;
      }

      /* ESTADO 1: OPEN (250px) */
      body[data-state="open"] {
        --sidebar-width: 250px;
      }

      /* ESTADO 2: MINI (70px) */
      body[data-state="mini"] {
        --sidebar-width: 70px;
      }

      body[data-state="mini"] .menu-text,
      body[data-state="mini"] .sidebar-header span {
        opacity: 0;
        pointer-events: none;
      }

      /* Desbordamiento al hacer hover en Mini */
      body[data-state="mini"] .sidebar .menu-link:hover {
        width: 200px;
        background-color: var(--hover-bg);
        border-radius: 0 8px 8px 0;
        box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.2);
      }

      body[data-state="mini"] .sidebar .menu-link:hover .menu-text {
        opacity: 1;
      }

      /* ESTADO 3: CLOSE (0px) */
      body[data-state="close"] {
        --sidebar-width: 0px;
      }

      body[data-state="close"] .sidebar {
        overflow: hidden;
      }

      /* ÁREA DE CONTENIDO Y CONTROLES */
      .main-content {
        margin-left: var(--sidebar-width);
        padding: 30px;
        width: 100%;
        transition: margin-left var(--transition-speed)
          cubic-bezier(0.4, 0, 0.2, 1);
      }

      .controls {
        background: white;
        padding: 20px;
        border-radius: 8px;
        display: inline-flex;
        gap: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      .btn-state {
        padding: 10px 18px;
        border: 1px solid #cbd5e1;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        color: #334155;
        transition: all 0.2s ease;
      }

      .btn-state:hover {
        background-color: var(--accent-color);
        color: white;
        border-color: var(--accent-color);
      }
    </style>
  </head>
  <body data-state="open">
    <nav class="sidebar">
      <div class="sidebar-header">
        <span class="menu-icon">⚡</span>
        <span class="menu-text" style="font-weight: bold; font-size: 1.1rem"
          >Dashboard</span
        >
      </div>
      <ul class="sidebar-menu">
        <li class="menu-item">
          <a href="#" class="menu-link">
            <span class="menu-icon">🏠</span>
            <span class="menu-text">Inicio</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="#" class="menu-link">
            <span class="menu-icon">📊</span>
            <span class="menu-text">Analíticas</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="#" class="menu-link">
            <span class="menu-icon">⚙️</span>
            <span class="menu-text">Configuración</span>
          </a>
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <h1>Contenido Principal</h1>
      <p style="margin: 15px 0">Selecciona el estado del menú lateral:</p>

      <div class="controls">
        <button class="btn-state" onclick="setState('open')">
          Open (250px)
        </button>
        <button class="btn-state" onclick="setState('mini')">
          Mini (70px)
        </button>
        <button class="btn-state" onclick="setState('close')">
          Close (0px)
        </button>
      </div>
    </main>

    <script>
      function setState(state) {
        document.body.setAttribute("data-state", state);
      }
    </script>
  </body>
</html>
