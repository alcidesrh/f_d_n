name: symfony8-vue-ai-monolith
base: ubuntu@24.04

# Dejamos solo los SDKs nativos hiper-estables y rápidos de aprovisionar
sdks:
  - name: system              # Motor Docker, docker-compose, git, etc.
  - name: node
    channel: 22/stable        # Entorno nativo para compilar Vue / Vite
  - name: ollama
    channel: latest/stable    # Servidor de LLMs local

plugs:
  puerto-vue:
    interface: tunnel
    endpoint: localhost:5173
  puerto-symfony:
    interface: tunnel
    endpoint: localhost:8000
  puerto-postgres:
    interface: tunnel
    endpoint: localhost:5432
  puerto-ollama:
    interface: tunnel
    endpoint: localhost:11434
  puerto-antigravity-mcp:
    interface: tunnel
    endpoint: localhost:8336
  ide-vscode:
    interface: desktop
  navegador-firefox:
    interface: desktop-launch
  db-dbeaver:
    interface: desktop

slots:
  puerto-vue:
    interface: tunnel
    endpoint: localhost:5173
  puerto-symfony:
    interface: tunnel
    endpoint: localhost:8000
  puerto-postgres:
    interface: tunnel
    endpoint: localhost:5432
  puerto-ollama:
    interface: tunnel
    endpoint: localhost:11434
  puerto-antigravity-mcp:
    interface: tunnel
    endpoint: localhost:8336

actions:
  # 1. Configuración de todo tu ecosistema de herramientas + Parches
  setup-kit: |
    echo "📦 Preparando herramientas del sistema y dependencias gráficas..."
    sudo apt-get update && sudo apt-get install -y wget gpg software-properties-common python3-pip python3-venv curl

    # --- INSTALACIÓN OFICIAL DE DOCKER DENTRO DEL SANDBOX ---
    echo "🐋 Instalando Docker y Docker Compose..."
    sudo apt-get install -y docker.io docker-compose-v2
    sudo usermod -aG docker $USER
    sudo chmod 666 /var/run/docker.sock

    # --- CORRECCIÓN: INSTALACIÓN DE OPENCODE CLI VÍA NPM (SIN SUDO) ---
    # Usamos la ruta nativa del SDK de Workshop e instalamos de forma directa
    echo "🤖 Instalando OpenCode CLI de manera global..."
    export PATH="/snap/bin:/usr/local/share/node/bin:$PATH"
    npm install -g opencode-ai

    # --- INSTALACIÓN DE GOOGLE ANTIGRAVITY SDK ---
    echo "🛸 Instalando Google Antigravity SDK..."
    pip install google-antigravity --break-system-packages

    # --- INSTALACIÓN DE FIREFOX DEVELOPER EDITION ---
    echo "🦊 Configurando e instalando Firefox Developer Edition..."
    sudo install -d -m 0755 /etc/apt/keyrings
    wget -q https://mozilla.org -O- | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
    echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://mozilla.org mozilla main" | sudo tee /etc/apt/sources.list.d/mozilla.list > /dev/null
    echo -e "Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000" | sudo tee /etc/apt/preferences.d/mozilla > /dev/null
    sudo apt-get update && sudo apt-get install -y firefox-devedition || true

    # --- INSTALACIÓN DE DBEAVER COMMUNITY EDITION ---
    echo "🐬 Configurando e instalando DBeaver CE para Postgres..."
    sudo add-apt-repository -y ppa:serge-rider/dbeaver-ce
    sudo apt-get update && sudo apt-get install -y dbeaver-ce || true

    echo "✅ ¡Todo el Dev Kit Gráfico, IA y Docker han sido configurados con éxito!"

  up: |
    echo "🚀 Inicializando contenedores del Monolito..."
    docker compose up -d

  down: |
    docker compose down

  pull-model: |
    echo "🧠 Descargando modelo para IA local..."
    ollama run qwen2.5-coder:7b

  db-migrate: |
    docker compose exec backend php bin/console doctrine:migrations:migrate --no-interaction
    
    
