parameters:
    cybersource_trusted_origins: "%env(json:CARDINAL_COMMERCE_ORIGINS)%"
    org_id: "%env(ORG_ID)%"
    env(credenciales): "%kernel.project_dir%/config/packages/dev/empresas.json"
    credenciales: "%env(json:file:credenciales)%"

services:
    _defaults:
        autowire: true
        bind:
            $cybersource_base_uri: "%env(CYBERSOURCE_BASE_URI)%"
            $credenciales: "%env(json:file:credenciales)%"
            $endpoints:
                authentication_1__setup_service: /risk/v1/authentication-setups
                authentication_2___check_enrollment: /risk/v1/authentications
                authentication_3___result: /risk/v1/authentication-results
                payment: /pts/v2/payments/
    App\Services\CybersourceApi:
        lazy: true
