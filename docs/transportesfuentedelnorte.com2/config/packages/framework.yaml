# see https://symfony.com/doc/current/reference/configuration/framework.html

framework:
    secret: "%env(APP_SECRET)%"
    #csrf_protection: true
    http_method_override: false

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
        gc_probability: null,
        cookie_lifetime: 0

    esi: true
    fragments: { path: /_fragment }
    php_errors:
        log: true

    form:
        legacy_error_messages: false

when@prod:
    framework:
        session:
            # El ACS/3DS entrega el returnUrl dentro de un iframe cross-site; con SameSite=Lax el
            # navegador no envía la cookie de sesión (Safari/Firefox) y el challenge se rechaza.
            cookie_samesite: none
            cookie_secure: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@dev:
    framework:
        ide: vscode://file/%%f:%%l&/srv/app/>/home/alcides/transportesfuentedelnorte.com/
