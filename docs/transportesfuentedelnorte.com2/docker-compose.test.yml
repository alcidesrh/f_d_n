# ⚠️ OVERRIDE SOLO PARA PRUEBAS — NUNCA USAR EN PRODUCCIÓN.
#
# Fuerza el stack a los endpoints de PRUEBA de CyberSource/Visa:
#   - APP_ENV=dev  ->  carga config/packages/dev/empresas.json (llaves de TEST)
#                      y .env.dev (CYBERSOURCE_BASE_URI=apitest, ORG_ID test)
#   - CYBERSOURCE_BASE_URI / ORG_ID como variables de entorno REALES para que
#     ganen a cualquier .env (incluido .env.local con valores de producción).
#
# El resto de la configuración (MAILER, FDN, eforcon, SERVER_NAME, private_key,
# MERCURE) sigue viniendo de .env.local / .env.dev / compose, SIN cambios.
#
# Sello de que quedó en test: el setup debe devolver
#   deviceDataCollectionUrl = https://centinelapistag.cardinalcommerce.com/V1/Cruise/Collect
# (en producción sería centinelapi.cardinalcommerce.com).
#
# IMPORTANTE — cadena de archivos:
#
#   LOCAL (pruebas):  SOLO base + test →  docker compose -f docker-compose.yml -f docker-compose.test.yml
#       NUNCA agregar docker-compose.prod.yml a la cadena local:
#         - El merge de Compose v5 "re-materializa" la DATABASE_URL del base cuando
#           hay un override intermedio: el !reset del test NO la vuelve a nulificar
#           y el contenedor terminaría conectando al postgres local VACÍO del base.
#         - El override prod fuerza SERVER_NAME=transportesfuentedelnorte.com y Caddy
#           intentaría ACME por el dominio real (falla en local, la web devuelve 000).
#
#   PRODUCCIÓN (VPS): SOLO base + prod →  docker compose -f docker-compose.yml -f docker-compose.prod.yml
#       NUNCA usar este override de test en el server.
#
# Uso local:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.test.yml exec php printenv | grep -E 'APP_ENV|CYBERSOURCE_BASE_URI|ORG_ID|DATABASE_URL'
services:
  php:
    volumes:
      - ./:/srv/app
    environment:
      APP_ENV: dev
      CYBERSOURCE_BASE_URI: https://apitest.cybersource.com
      ORG_ID: 1snn5n9w
      # Base no define APP_SECRET y en dev FrameworkBundle lo exige no vacío.
      APP_SECRET: ${APP_SECRET:-4ca07b58b4c2f273ba5bf73191158c6b}
      # Sin DATABASE_URL en el entorno real, Symfony carga .env.dev (BD remota de
      # producción vía el puerto publicado) en lugar del postgres local VACÍO del
      # base. Funciona en la cadena de 2 archivos (base+test); ver cabecera.
      DATABASE_URL: !reset

  caddy:
    volumes:
      - ./public:/srv/app/public:ro