Desde 1958 abriendo caminos cumpliendo destinos.: Since 1958 there have been roads fulfilling destinies.
La empresa Transportes Fuente Del Norte fue fundada en 1,958 por un hombre pionero y visionario, que a pesar de las condiciones viales no dejo que sus esfuerzos fueran en vano.: The company Transportes Fuente Del Norte was founded in 1958 by a pioneer and visionary man who, despite the road conditions, did not let his efforts go in vain.
Su inicio se origino con un Pick-Up  que transportaba pasajeros de la aldea mariscos al crucé de trincheras, y una camionetilla de tres filas que salía de mariscos a los amates, así como de mariscos a puerto barrios.: Its beginning originated with a Pick-Up that transported passengers from the seafood village to the trench crossing, and a three-row truck that went from seafood to the amates, as well as from seafood to the neighborhood port.
No muy lejano en el año 1969 da otro resultado la Empresa Transportes Fuente Del Norte ya que logra abrir brecha hacia el territorio Petenero, así como el área del atlántico,  lográndose la línea de transporte de Guatemala a puerto barrios y Guatemala a Santa Elena, Guatemala a la cruces, Guatemala a Melchor, esto era el resultado de un trabajo arduo y tenaz que se había establecido don Alfredo Mendoza Pellecer, con su empresa. Don Alfredo Mendoza al ver que la Empresa Transportes Fuente Del Norte, estaba dando pasos agigantados en el año 1981 tuvo que dialogar con la empresa litegua para definir áreas de trabajo llegando al mutuo acuerdo de que Transportes Fuente Del Norte tendría la línea de transporte de guatemala a peten, y transportes litegua de guatemala a puerto barrios.: Not too far in the year 1969, the Empresa Transportes Fuente Del Norte gives another result since it manages to open a gap towards the Petenero territory, as well as the Atlantic area, achieving the transport line from Guatemala to Puerto Barrios and Guatemala to Santa Elena, Guatemala. to the crosses, Guatemala to Melchor, this was the result of hard and tenacious work that Mr. Alfredo Mendoza Pellecer had established with his company. When Don Alfredo Mendoza saw that the Transportes Fuente Del Norte Company was taking giant steps in 1981, he had to talk with the company from Lithuania to define areas of work, reaching a mutual agreement that Transportes Fuente Del Norte would have the Guatemalan transport line. to peten, and litegua transport from guatemala to puerto barrios.
Don Alfredo Mendoza en su enfoque siempre pensó en la familia ya que se preocupo por dejar un legado a todos sus hijos y forjándolos para que su punto de vista siguiera mucho más lejos y así fueran los pioneros de las nuevas generaciones.: Don Alfredo Mendoza in his approach always thought of the family since he was concerned about leaving a legacy to all his children and forging them so that his point of view would continue much further and thus be the pioneers of the new generations.
Esta nueva visión dio origen a un servicio de lujo dando origen al servicio de Autobuses Clase Oro y Maya de Oro. A la fecha la empresa Transportes Fuente Del Norte se ha extendido tanto dentro del país así como fuera del mismo, como lo es honduras, el salvador, belice, fronteras de méxico y belice.: This new vision gave rise to a luxury service giving rise to the Gold and Maya de Oro Class Bus service. To date, the company Transportes Fuente Del Norte has expanded both within the country as well as outside of it, such as Honduras, el salvador, belize, borders of mexico and belize.
Cuenta con el servicio de lujo con autobuses Clase Oro  de doble piso, para el sur y norte del país.  Cuenta con servicio de santa elena a cobán. Con sus respectivos derechos y autorizaciones de la dirección general de transportes.  Estos son los resultados de una persona pionera y soñadora  que con la Empresa Fuente Del Norte a llegado tan lejos dando un servicio a toda la población nacional con un 75% y extranjera.: It has a luxury service with double-decker Gold Class buses, to the south and north of the country. It has a service from Santa Elena to Cobán. With their respective rights and authorizations from the General Directorate of Transport. These are the results of a pioneer and dreamer who, with the Fuente Del Norte Company, has come so far providing a service to the entire national population with 75% foreigners.
Actualmente está constituida como sociedad anónima bajo el nombre de “Transportes Fuente Del Norte La Pionera, S.A.: It is currently constituted as a public limited company under the name of “Transportes Fuente Del Norte La Pionera, S.A.
Empresa para servicio de transporte de pasajeros y carga  inscrita con patente de comercio de Sociedad  bajo el número de Registro 42723, folio 373, libro 136, de sociedades . Registrada el  31 de enero del año 2,000. Inscrita ante la  Superintendencia de Administración Tributaria (SAT) el 04 de febrero del año 2,000 con la actividad de transporte de pasajeros y carga por carretera.: Company for passenger and cargo transport services registered with a Company trade patent under Registry number 42723, folio 373, book 136, of companies. Registered on January 31, 2000. Registered with the Superintendence of Tax Administration (SAT) on February 4, 2000 with the activity of transporting passengers and cargo by road.
Ser  una empresa de transporte de  pasajeros y encomienda, a la vanguardia en la aplicación de tecnología, garantizando un servicio de calidad y confort.: Being a passenger and parcel transport company, at the forefront in the application of technology, guaranteeing quality service and comfort.
Ser líderes en el servicio de transporte de  pasajeros y encomienda nacional e internacional, ofreciendo un servicio de calidad a nuestros clientes, una fuente de trabajo estable para nuestros empleados, beneficio para el desarrollo social y económico del país; basado en la eficiencia y  actitudes orientadas a la satisfacción del cliente y a la mejora continua.: To be leaders in the national and international passenger transport and parcel service, offering a quality service to our clients, a stable source of work for our employees, benefit for the social and economic development of the country; based on efficiency and attitudes aimed at customer satisfaction and continuous improvement.
Ofrecer el mejor servicio de transporte de pasaje y encomiendas, de manera segura y confiable.: Offer the best transportation service for passengers and parcels, safely and reliably.
Velar porque todo el personal aplique las normas y procedimientos de la empresa en la prestación de todos los servicios.: Ensure that all staff apply the rules and procedures of the company in the provision of all services.
Garantizar la eficiencia y seguridad, para que se proporcione a los clientes, el mejor servicio posible.: Guarantee efficiency and safety, so that customers are provided with the best possible service.
