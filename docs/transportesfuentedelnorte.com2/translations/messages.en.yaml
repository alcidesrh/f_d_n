Puedes transferir o cambiar de fecha su boleto hasta 3 horas antes de su salida en cualquier taquilla de Transportes Fuente Del Norte donde entregará el boleto original una identificación oficial vigente de la persona cuyo nombre aparece en el boleto. No hay penalización al solicitar un cambio de fecha u horario de salida o transferir el boleto, si lo hace antes de 3 horas de la salida, si lo hace posterior a ese tiempo queda a discreción de la empresa la desición de reasignarlo.: You can transfer or change the date of your ticket up to 3 hours before departure at any Transportes Fuente Del Norte ticket window. You will need to present the original ticket and a valid government-issued photo ID of the person whose name appears on the ticket. There is no penalty for requesting a change of date or departure time, or for transferring the ticket, if done more than 3 hours before departure. If you request it after that time, the company reserves the right to reassign it.
