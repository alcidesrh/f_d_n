Valores: Values
Honestidad. Sabemos que en la honestidad está basado el logro de los objetivos y la permanencia en el mercado, por ello, hacemos de este valor el eje fundamental de todas nuestras operaciones, tanto hacia los clientes, como hacia todas y cada una de las personas que aportan su talento y servicio a nuestra empresa; reconocemos nuestras fuerzas y nos esforzamos por superar nuestras debilidades día a día.: Honesty. We know that the achievement of objectives and permanence in the market is based on honesty, therefore, we make this value the cornerstone of all our operations, both towards customers and towards each and every one of the people. who contribute their talent and service to our company; we recognize our strengths and strive to overcome our weaknesses day by day.
Respeto. Estamos convencidos de que a través del respeto por las personas y por todos los compromisos adquiridos, podremos lograr el posicionamiento de nuestra empresa y el reconocimiento de la calidad de los servicios que prestamos.: Respect. We are convinced that through respect for people and all the commitments made, we can achieve the positioning of our company and recognition of the quality of the services we provide
Trabajo. Creemos que el trabajo es la fuente primordial de beneficios para todos aquellos que se involucran en nuestras operaciones y que el único indicador de los esfuerzos que realizamos es el resultado.: Worked. We believe that work is the primary source of benefits for all those who are involved in our operations and that the only indicator of the efforts we make is the result.
Tecnología. Reconocemos la importancia de la tecnología en el logro de nuestras metas y estamos comprometidos en su aplicación y desarrollo para alcanzar la vanguardia de calidad en servicio y la puntualidad en los destinos  que nuestros clientes nos confían.: Technology. We recognize the importance of technology in achieving our goals and we are committed to its application and development to reach the forefront of quality service and punctuality in the destinations that our clients trust us.
Seguridad. Sabemos la responsabilidad que conlleva nuestra operación, por eso dimensionamos la importancia de apegarnos a sistemas y procedimientos que salvaguarden la integridad de los clientes que transportamos y de las personas que intervienen en su traslado.: Security. We know the responsibility that our operation entails, that is why we consider the importance of adhering to systems and procedures that safeguard the integrity of the clients we transport and the people involved in their transfer.
En el año de 1964 la Empresa Transportes Fuente del Norte da inicio a sus resultados  ya que adquiere la línea de transportes de bananera a Guatemala, siendo una posición que requería mucho esfuerzo y dedicación.: In 1964, the Empresa Transportes Fuente del Norte began its results as it acquired the banana transport line to Guatemala, being a position that required a lot of effort and dedication.
