No es la misma empresa. Solo se aplica en las rutas donde el servicio lo brindan dos empresas diferentes que van alternando los días. Por ejemplo la empresa que da el servicio el día 1 de un mes cualquiera, será la misma que lo haga en los días 3, 5, 7, ..., 29, 31 del mismo mes: It is not the same company. It only applies on routes where the service is provided by two different companies that alternate days. For example, the company that provides the service on day 1 of any month will be the same one that does it on days 3, 5, 7, ..., 29, 31 of the same month.
Ingresar con armas de fuego, arma blanca u objetos punzocortantes. En caso de portar alguno de estos objetos, deberás entregarlo al conductor quien te lo devolverá al llegar a tu destino.: Entering with firearms, knives or sharp objects. If you carry any of these objects, you must hand it over to the driver who will return it to you when you arrive at your destination.
Abordar en estado de ebriedad o con señales de haber consumido drogas.: Boarding while intoxicated or with signs of having consumed drugs.
