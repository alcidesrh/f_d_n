# Production environment override
services:
  php:
    volumes:
      - ./:/srv/app
    environment:
      # Defaults espejo de docker-compose.yml: si el shell/compose-.env del server
      # no exporta estas variables, NUNCA deben quedar vacías (un env real vacío
      # gana a los archivos .env de Symfony y rompe el JWT de Mercure al arrancar:
      # lcobucci "Key cannot be empty"). Exportarlas en el server las overrides.
      APP_SECRET: ${APP_SECRET:-<CAMBIAR>}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_URL: https://${SERVER_NAME:-transportesfuentedelnorte.com}/.well-known/mercure
      # ⚠️ NO tocar DATABASE_URL aquí. El server de producción exporta
      # POSTGRES_PASSWORD y la interpolación de docker-compose.yml genera la URL
      # real (app:${POSTGRES_PASSWORD}@database:5432) que conecta al servicio
      # `database` con sus datos reales (volumen ./docker/db/data).
      # El !reset de DATABASE_URL vive SOLO en docker-compose.test.yml, para que
      # el stack de pruebas local use .env.dev en lugar del postgres vacío local.

  caddy:
    volumes:
      - ./public:/srv/app/public:ro
    environment:
      # Sin SERVER_NAME exportado, caddy quedaba atado a "localhost" y el sitio no
      # respondía por el dominio real. Este default es el de ESTE despliegue.
      SERVER_NAME: ${SERVER_NAME:-transportesfuentedelnorte.com}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}

  ###> doctrine/doctrine-bundle ###
  database:
    # Puerto explícito (32769) para que el stack de pruebas local pueda
    # alcanzar esta BD. El .env.dev del repo apunta a :32769.
    # ⚠️ Seguridad: restringir con firewall (ufw allow 32769/tcp) y no exponer
    # a redes no deseadas; el postgres开门 al mundo externo en este puerto.
    ports:
      - "${DB_PORT:-32769}:5432"
  ###< doctrine/doctrine-bundle ###
