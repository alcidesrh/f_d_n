# Production environment override (`make prod`). Variables y secretos en .env.prod.local (fuera de git):
# compose los usa para interpolar (--env-file) y los contenedores de PHP los reciben con env_file,
# porque la imagen de prod no lleva backend/.env.local.
services:
  backend:
    build: &backend-build
      context: ./backend
      target: frankenphp_prod
      # La página web pública se compila dentro de la imagen (backend/Dockerfile, pagina_build).
      additional_contexts:
        pagina: ./pagina
        frontend: ./frontend
    restart: unless-stopped
    env_file: .env.prod.local
    environment:
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}

  worker: &worker-prod
    build: *backend-build
    env_file: .env.prod.local
    environment:
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}

  worker-pesadas: *worker-prod

  programador: *worker-prod

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped

  database:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
