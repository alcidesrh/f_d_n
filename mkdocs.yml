site_name: FDN Transportes
site_description: Documentación del sistema FDN — monorepo backend (Symfony + API Platform) + frontend (Quasar/Vue 3)
site_author: Alcides Rodríguez
site_url: ""
docs_dir: docs
site_dir: ../site
theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
repo_url: ""
edit_uri: ""
plugins:
  - search:
      lang: es
  - awesome-pages
  - mermaid2:
      version: 11.6.0
      arguments:
        theme: base
        themeVariables:
          primaryColor: "#3949ab"
          primaryTextColor: "#fff"
          primaryBorderColor: "#283593"
          lineColor: "#5c6bc0"
          secondaryColor: "#e8eaf6"
          tertiaryColor: "#c5cae9"
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  - gen-files:
      scripts:
        - scripts/gen-dirtree.py
        - scripts/gen-makefile-docs.py
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.keys
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
extra:
  generator: false
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:alcidesrh@gmail.com
  copyright: Copyright &copy; 2026 Alcides Rodríguez
