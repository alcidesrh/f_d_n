<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <!-- `interactive-widget`: en Android el teclado achica la página (el redactor del chat queda encima). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FDN">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
    <title>Fuentes del Norte</title>
    <!-- Modo del tema antes de cargar la app, sin destello blanco en oscuro: lo guardado
         por la store `ui` del usuario (app/ui.ts, claves de core/auth/alcanceSesion.ts) o
         el del SO. Después lo mantiene App.vue. #000 = `surface-0` del oscuro. -->
    <script>
      (function () {
        try {
          var usuario = localStorage.getItem('sesion:propietario')
          var ui = JSON.parse(localStorage.getItem(usuario ? 'usuario/' + usuario + '/ui' : 'sin-usuario/ui') || '{}')
          var oscuro = ui.mode ? ui.mode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.className = oscuro ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <style>
      html.dark { color-scheme: dark; background: #000; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
