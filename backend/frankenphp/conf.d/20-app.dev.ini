xdebug.client_host = xdebug://gateway
xdebug.start_with_request=yes
; xdebug.start_with_request=trigger
; Requires VSCode launch.json pathMappings: {"/app": "${workspaceFolder}/backend"}
xdebug.file_link_format = vscode://file/%f:%l

; Fotos y archivos del chat (App\Chat\Archivos::MAX_BYTES = 10 MB).
upload_max_filesize = 10M
; El correo entrante de MailPace (App\Correo\Entrante) llega en JSON con los adjuntos en
; base64 y el original completo: hasta ~3 veces lo que pesan. Cada subida sigue limitada arriba.
post_max_size = 40M
