# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Contacto que se declara a los servicios de push (VAPID `subject`; sobrescribible con PUSH_VAPID_CONTACTO).
    push_vapid_contacto_defecto: "mailto:soporte@transportesfuentedelnorte.com"
    # Certificador FEL (Forcon) y pasarela de pago (Cybersource): su configuración está en la
    # base (ConfiguracionForcon, ConfiguracionCybersource; app:fel:configuracion, app:pago:configuracion).
    # El correo (MailPace, dominios, remitentes y buzón de contacto) también: ConfiguracionCorreo (ADR-048).
    # Servicio de rutas OSRM para los km por carretera de las rutas (sobrescribible con OSRM_URL).
    ruta_osrm_url_defecto: "https://router.project-osrm.org"
    # Cuándo se enteran los navegadores de un cambio en la configuración de entidades (ADR-036):
    # "automatica" (al guardar) o "manual" (al publicar en /configuracion/publicacion);
    # sobrescribible con METADATA_PUBLICACION.
    metadata_publicacion_defecto: "automatica"

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Entity/"
            - "../src/Kernel.php"

    # Explicit connection bindings for migration services
    App\Migration\Limpiador:
        arguments:
            $newConn: "@doctrine.dbal.default_connection"

    # Conexión al SQL Server legacy con preflight TCP no bloqueante (SondaLegado):
    # si el host no responde, el PDO falla en ~1.5s en vez de colgar ~130s (kernel TCP).
    # Se abre al primer uso y se rehace si se cayó (PdoLegado): el worker y el
    # ciclo de la sincronización viven horas.
    PDO $oldPdo:
        class: App\Migration\PdoLegado
        factory: ['@App\Migration\SondaLegado', "crearPdoReconectable"]

    App\Migration\SondaLegado:
        arguments:
            $host: "%env(systemfdn_host)%"
            $port: "%env(systemfdn_port)%"
            $dbname: "%env(systemfdn_dbname)%"
            $username: "%env(systemfdn_user)%"
            $password: "%env(systemfdn_password)%"
            $timeout: 5

    # Accesos (ADR-039): denegar por defecto en la API genérica. Prioridad 0:
    # por dentro de la caché de la metadata (-10), después de los demás decoradores.
    App\Acceso\Api\SeguridadPorDefecto:
        decorates: api_platform.metadata.resource.metadata_collection_factory
        decoration_priority: 0
        arguments:
            $interna: '@.inner'

    # Por fuera de todo (la fábrica de Doctrine, -50, queda fuera de la caché).
    App\Acceso\Api\MetadataEnMemoria:
        decorates: api_platform.metadata.resource.metadata_collection_factory
        decoration_priority: -100
        arguments:
            $interna: '@.inner'

    App\Acceso\Catalogo\CatalogoRecursos:
        arguments:
            $nombres: '@api_platform.metadata.resource.name_collection_factory'

    App\Security\GraphiQLRequestMatcher:
        tags: ["security.request_matcher"]

    App\Services\UsuarioPasswordHasher:
        bind:
            $processor: "@api_platform.doctrine.orm.state.persist_processor"

    App\GraphQL\Type\Converter\DateTypeConverter:
        decorates: "api_platform.graphql.type_converter"
        arguments:
            # $decorated: '@App\GraphQL\Type\Converter\DateTypeConverter.inner'
            $types: "@api_platform.graphql.types_container"
        # autoconfigure: false

    App\GraphQL\Type\Definition\DateType:
        tags:
            - { name: api_platform.graphql.type }

    # Venta de asientos (ADR-021): adaptadores activos de los puertos externos.
    # Certificador FEL: FelActivo elige Forcon o el simulado según ConfiguracionForcon.
    App\Venta\Facturacion\CertificadorFel: '@App\Venta\Facturacion\FelActivo'
    App\Venta\Facturacion\ConsultaContribuyente: '@App\Venta\Facturacion\FelActivo'
    # Pasarela de pago: PasarelaActiva elige Cybersource o la simulada según ConfiguracionCybersource.
    App\Venta\Pago\PasarelaPago: '@App\Venta\Pago\PasarelaActiva'
