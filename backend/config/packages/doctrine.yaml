doctrine:
    dbal:
        default_connection: default
        types:
            bigint_texto: App\Doctrine\Type\BigintTextoType
        connections:
            default:
                # configure these for your database server
                url: "%env(DATABASE_URL)%"
                # Ignora los índices que solo existen en migraciones (`ex_*`, ADR-030; `nat_*`, ADR-056).
                schema_manager_factory: App\Doctrine\Schema\ExclusionConstraintsSchemaManagerFactory
                logging: true
                profiling_collect_backtrace: "%kernel.debug%"

    orm:
        default_entity_manager: "default"
        entity_managers:
            default:
                connection: default
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                validate_xml_mapping: true
                dql:
                    string_functions:
                        CAST: App\Doctrine\CastFunction
                auto_mapping: true
                filters:
                    tenant_filter:
                        class: App\Doctrine\TenantFilter
                        enabled: false
                mappings:
                    App:
                        type: attribute
                        is_bundle: false
                        dir: "%kernel.project_dir%/src/Entity"
                        prefix: 'App\Entity'
                        alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: "_test%env(default::TEST_TOKEN)%"

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
