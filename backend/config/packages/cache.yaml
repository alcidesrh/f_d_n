framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # Conteos del legado del panel /migracion: en disco también en dev
            # (allí "app" es un array que se vacía en cada request).
            cache.migracion:
                adapter: cache.adapter.filesystem
                default_lifetime: 300
            # Latidos de presencia del chat: compartidos entre procesos (en dev `cache.app` es un array por proceso).
            cache.presencia:
                adapter: cache.adapter.filesystem
                default_lifetime: 100
            # Huella del schema GraphQL (ADR-036): se calcula una vez por compilación del
            # contenedor. El adaptador de sistema se versiona con cada compilación, también
            # en dev (ahí `cache.system` es un array y la recalcularía en cada request).
            cache.metadata:
                adapter: cache.adapter.system
            # Estado del programador de tareas (ADR-044): última corrida de cada tarea,
            # en PostgreSQL (tabla `cache_items`) para que sobreviva a recrear el contenedor.
            cache.programador:
                adapter: cache.adapter.doctrine_dbal
                provider: doctrine.dbal.default_connection
            # Copias del tablero de gestión (`App\Tablero\TableroEnCache`): las rehace
            # el worker y las lee el backend, que no comparten disco.
            cache.tablero:
                adapter: cache.adapter.doctrine_dbal
                provider: doctrine.dbal.default_connection

when@dev:
    framework:
        cache:
            app: cache.adapter.array
            system: cache.adapter.array
