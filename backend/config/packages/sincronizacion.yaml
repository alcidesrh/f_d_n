# Sincronización temporal con el legado (ADR-042). Se quita con el módulo
# `src/Sincronizacion`, este archivo, `config/routes/sincronizacion.yaml`, la
# línea de `security.yaml` y la migración Version20261025090000.
parameters:
    # Clave compartida con el legado para `/api/sincronizacion/legado/*`
    # (cabecera `X-Sincronizacion-Clave`). Vacía: el legado no puede llamar.
    env(SINCRONIZACION_CLAVE): ""
    # URL de esta API vista desde el servidor del legado (p. ej. https://fdn.ejemplo.com).
    # `app:sincronizacion:instalar-legado` la deja en `sync_config` del legado.
    env(SINCRONIZACION_URL_FDN): ""
    # 1: solo trae del legado y nunca escribe allá fuera de `sync_*` (un FDN de
    # desarrollo contra el legado de producción). El legado queda apagado.
    env(SINCRONIZACION_SOLO_TRAER): "0"

doctrine:
    dbal:
        connections:
            default:
                # Las tablas `sync_*` no son del modelo: que los diff de migraciones no las borren.
                schema_filter: ~^(?!sync_)~
