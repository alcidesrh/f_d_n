security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\Usuario:
            algorithm: auto
            migrate_from:
                - App\Security\LegacySha512PasswordHasher
        App\Security\LegacySha512PasswordHasher:
            id: App\Security\LegacySha512PasswordHasher
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\Usuario
                property: username

    # Sin role_hierarchy: para Symfony todo usuario es ROLE_USER; lo que puede
    # hacer cada uno lo deciden sus asignaciones (App\Acceso\CapacidadVoter, ADR-039).

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: true
        main:
            lazy: true
            # Sin sesión: cada petición trae su Bearer. Con sesión, PHP bloquea el
            # archivo de la sesión durante toda la petición y las que el navegador
            # hace en paralelo (misma cookie) esperaban una detrás de otra.
            stateless: true
            provider: app_user_provider
            # Un usuario desactivado no entra, ni con un token que ya tenía.
            user_checker: App\Acceso\UsuarioActivo
            json_login:
                check_path: /api/login
                username_path: username
                password_path: password
            logout:
                # Respuesta y revocación del token: App\EventListener\LogoutListener.
                path: /api/logout
                # clear_site_data:
                #     - cache
                #     - storage
                #     - executionContexts
            access_token:
                token_handler: App\Security\ApiTokenHandler

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_decision_manager:
        strategy: unanimous

    access_control:
        # - { path: "^/", roles: PUBLIC_ACCESS }
        # - { path: "^/api/graphiql", roles: PUBLIC_ACCESS }
        # - { path: "^/_wdt", roles: PUBLIC_ACCESS }
        # - { path: "^/docs/graphql", roles: PUBLIC_ACCESS }
        # - { path: "^/graphql/graphiql", roles: PUBLIC_ACCESS }
        # - { path: "^/_profiler", roles: PUBLIC_ACCESS }
        # - { path: "^/bundles", roles: PUBLIC_ACCESS }
        # - { path: "^/docs", roles: PUBLIC_ACCESS }
        # - { path: "^/login*", roles: PUBLIC_ACCESS }
        # # - { path: "^/login$", roles: PUBLIC_ACCESS }
        # - { path: "^/api/me/permissions", roles: ROLE_USER }
        # - { path: "^/api$", roles: PUBLIC_ACCESS }
        # - { path: "^/api/", roles: ROLE_USER }
        # - { request_matcher: App\Security\GraphiQLRequestMatcher, roles: PUBLIC_ACCESS }
        # Página web pública y su API (venta en línea, ADR-021).
        - { path: "^/api/publico/", roles: PUBLIC_ACCESS }
        - { path: "^/pagina", roles: PUBLIC_ACCESS }
        # Archivos del chat: URL firmada que vence (App\Chat\Archivos), sin Bearer.
        - { path: '^/api/chat/archivos/\d+/[0-9a-f]{32}$', roles: PUBLIC_ACCESS }
        # Fotos de grupo: URL firmada (App\Chat\FotoGrupo), sin Bearer.
        - { path: '^/api/chat/canales/\d+/foto/[0-9a-f]{32}$', roles: PUBLIC_ACCESS }
        # Fotos de perfil: URL firmada y estable (App\Cuenta\FotoPerfil), sin Bearer.
        - { path: '^/api/usuarios/-?\d+/foto/[0-9a-f]{32}$', roles: PUBLIC_ACCESS }
        # Lo que llama el legado durante la sincronización (ADR-042): con clave compartida, sin Bearer.
        - { path: "^/api/sincronizacion/legado/", roles: PUBLIC_ACCESS }
        - { path: "^/", roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
