# Sincronización temporal con el legado (ADR-042): el ciclo de cada minuto.
# Se suma a los demás archivos solo mientras dure la mudanza:
#   docker compose -f compose.yaml -f compose.prod.yaml -f compose.sincronizacion.yaml up -d sincronizacion
# Con el interruptor apagado no hace nada. Sale cada hora y Docker lo levanta de nuevo.
services:
  sincronizacion:
    extends:
      file: compose.yaml
      service: worker
    container_name: sincronizacion
    command: ["php", "bin/console", "app:sincronizar", "--cada=60", "--durante=3600"]
