<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Sidebar State Toggle</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      :root {
        --bg-color: #f4f6f8;
        --sidebar-bg: #1e293b;
        --text-color: #f8fafc;
        --hover-bg: #334155;
        --accent-color: #3b82f6;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        min-height: 100vh;
        display: flex;
      }

      /* BARRA DE NAVEGACIÓN LATERAL */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 250px;
        background-color: var(--sidebar-bg);
        color: var(--text-color);
        z-index: 100;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .sidebar-header {
        padding: 20px 15px;
        display: flex;
        align-items: center;
        height: 60px;
        border-bottom: 1px solid var(--hover-bg);
        white-space: nowrap;
      }

      .sidebar-menu {
        list-style: none;
        padding: 10px 0;
      }

      .menu-item {
        position: relative;
      }

      .menu-link {
        display: flex;
        align-items: center;
        padding: 14px 23px;
        color: var(--text-color);
        text-decoration: none;
        white-space: nowrap;
        position: relative;
        z-index: 10;
        width: 250px;
      }

      .menu-icon {
        font-size: 1.2rem;
        min-width: 24px;
        display: flex;
        justify-content: center;
      }

      .menu-text {
        margin-left: 15px;
      }

      /* ÁREA DE CONTENIDO Y CONTROLES */
      .main-content {
        margin-left: 250px;
        padding: 30px;
        width: 100%;
      }

      .controls {
        background: white;
        padding: 20px;
        border-radius: 8px;
        display: inline-flex;
        gap: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      .btn-state {
        padding: 10px 18px;
        border: 1px solid #cbd5e1;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        color: #334155;
        transition:
          background-color 0.2s,
          color 0.2s;
      }

      .btn-state:hover {
        background-color: var(--accent-color);
        color: white;
        border-color: var(--accent-color);
      }
    </style>
  </head>
  <body>
    <nav class="sidebar">
      <div class="sidebar-header">
        <span class="menu-icon">⚡</span>
        <span class="menu-text" style="font-weight: bold; font-size: 1.1rem"
          >Dashboard</span
        >
      </div>
      <ul class="sidebar-menu">
        <li class="menu-item">
          <a href="#" class="menu-link">
            <span class="menu-icon">🏠</span>
            <span class="menu-text">Inicio</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="#" class="menu-link">
            <span class="menu-icon">📊</span>
            <span class="menu-text">Analíticas</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="#" class="menu-link">
            <span class="menu-icon">⚙️</span>
            <span class="menu-text">Configuración</span>
          </a>
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <h1>Contenido Principal</h1>
      <p style="margin: 15px 0">
        Selecciona el estado del menú lateral con GSAP:
      </p>

      <div class="controls">
        <button class="btn-state" onclick="setState('open')">
          Open (250px)
        </button>
        <button class="btn-state" onclick="setState('mini')">
          Mini (70px)
        </button>
        <button class="btn-state" onclick="setState('close')">
          Close (0px)
        </button>
      </div>
    </main>

    <script>
      let currentState = "open";

      function setState(newState) {
        currentState = newState;

        const duration = 0.4;
        const ease = "power2.inOut";

        if (newState === "open") {
          gsap.to(".sidebar", { width: 250, duration, ease });
          gsap.to(".main-content", { marginLeft: 250, duration, ease });
          gsap.to(".menu-text", { opacity: 1, duration: duration * 0.8, ease });
        } else if (newState === "mini") {
          gsap.to(".sidebar", { width: 70, duration, ease });
          gsap.to(".main-content", { marginLeft: 70, duration, ease });
          gsap.to(".menu-text", { opacity: 0, duration: duration * 0.5, ease });
        } else if (newState === "close") {
          gsap.to(".sidebar", { width: 0, duration, ease });
          gsap.to(".main-content", { marginLeft: 0, duration, ease });
          gsap.to(".menu-text", { opacity: 0, duration: duration * 0.5, ease });
        }
      }

      // Eventos Hover para el desbordamiento fluido en estado "mini"
      const menuLinks = document.querySelectorAll(".menu-link");

      menuLinks.forEach((link) => {
        const text = link.querySelector(".menu-text");

        link.addEventListener("mouseenter", () => {
          if (currentState === "mini") {
            gsap.to(link, {
              backgroundColor: "#334155",
              width: 200,
              borderRadius: "0 8px 8px 0",
              duration: 0.25,
              ease: "power1.out",
            });
            gsap.to(text, { opacity: 1, duration: 0.2 });
          } else if (currentState === "open") {
            gsap.to(link, { backgroundColor: "#334155", duration: 0.2 });
          }
        });

        link.addEventListener("mouseleave", () => {
          if (currentState === "mini") {
            gsap.to(link, {
              backgroundColor: "transparent",
              width: 250,
              borderRadius: "0px",
              duration: 0.25,
              ease: "power1.in",
            });
            gsap.to(text, { opacity: 0, duration: 0.15 });
          } else if (currentState === "open") {
            gsap.to(link, { backgroundColor: "transparent", duration: 0.2 });
          }
        });
      });
    </script>
  </body>
</html>
