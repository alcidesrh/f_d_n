# Dev en la VPS por el dominio de producción (https://fdn2.duckdns.org). Se suma a compose.yaml y compose.override.yaml;
# los secretos van en .env.vps.local (fuera de git). Lo levanta `make vps`.
# Dev y prod no corren a la vez y comparten el volumen caddy_data: dev usa el certificado de Let's Encrypt de prod.
services:
  backend:
    environment: &vps-environment
      APP_SECRET: ${APP_SECRET}
      DEFAULT_URI: https://fdn2.duckdns.org
      MERCURE_PUBLIC_URL: https://fdn2.duckdns.org/.well-known/mercure
      TRUSTED_HOSTS: ^(localhost|fdn2\.duckdns\.org)$$|backend$$
  worker:
    environment: *vps-environment
  worker-pesadas:
    environment: *vps-environment
  programador:
    environment: *vps-environment
  database:
    # Sin puerto público: la base solo la usan los contenedores.
    ports: !reset []
