<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fuentes del Norte</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box;
        font: 16px/1.5 system-ui, sans-serif; text-align: center;
        background: light-dark(#f8fafc, #0f172a); color: light-dark(#0f172a, #f1f5f9);
      }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.5rem; color: light-dark(#475569, #94a3b8); }
      button {
        font: inherit; font-weight: 600; min-height: 2.75rem; padding: 0 1.5rem;
        border: 0; border-radius: .5rem; background: #2563eb; color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No se pudo abrir Fuentes del Norte. Revise la señal o el wifi e intente de nuevo.</p>
      <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Reintentar</button>
    </main>
    <script>
      // Al volver la red, reintenta solo.
      addEventListener('online', function () { history.length > 1 ? history.back() : location.reload() })
    </script>
  </body>
</html>
